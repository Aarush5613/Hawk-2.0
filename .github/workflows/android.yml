name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # This is the "Magic" step that fixes the wrapper issues
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Grant Execute Permissions
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug -Pkotlin.metrics.enabled=false --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hawk-launcher-debug
        path: app/build/outputs/apk/debug/app-debug.apk
