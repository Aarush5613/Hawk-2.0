name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        # This is the secret sauce: it caches your downloads automatically
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Build with Gradle
      # --no-daemon and --parallel make it more stable on limited-RAM runners
      run: gradle assembleDebug --no-daemon --parallel -Pkotlin.metrics.enabled=false

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hawk-launcher-debug
        path: app/build/outputs/apk/debug/app-debug.apk
