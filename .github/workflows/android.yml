name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Added flags to bypass the statistics error and use pre-installed gradle
    - name: Build with Gradle
      run: gradle :app:assembleDebug -Pkotlin.metrics.enabled=false --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hawk-launcher-debug
        path: app/build/outputs/apk/debug/app-debug.apk
