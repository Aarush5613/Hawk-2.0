name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually click "Run" if needed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # This creates the 'gradle-wrapper.jar' which is missing from web-created repos
    - name: Generate Gradle Wrapper
      run: gradle wrapper

    # This ensures the script you just pasted can actually run
    - name: Grant Execute Permissions
      run: chmod +x gradlew

    # The actual compilation step
    - name: Build with Gradle
      run: ./gradlew assembleDebug -Pkotlin.metrics.enabled=false

    # Makes the APK available for download on your Moto Edge 60
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hawk-launcher-debug
        path: app/build/outputs/apk/debug/app-debug.apk
