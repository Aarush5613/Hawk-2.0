name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    # This command lists your files in the logs so we can see if they are in the wrong place
    - name: Debug File Structure
      run: find . -maxdepth 4 -not -path '*/.*'

    - name: Build APK
      # --x (exclude) stops the validation tasks from killing the build
      run: gradle assembleDebug --no-daemon -x test -x lint -Pkotlin.metrics.enabled=false

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hawk-launcher-debug
        path: "**/*.apk"
