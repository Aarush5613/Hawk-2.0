name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Build APK
      # We use 'gradle' directly to bypass the missing wrapper issues
      run: gradle assembleDebug --no-daemon -Pkotlin.metrics.enabled=false

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: hawk-launcher-debug
        path: "**/*.apk"
        
